<!-- @dsCard group="Game" height=760 subtitle="Four colors, four shapes" -->
<!doctype html>
<html lang="ky"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans)}
.stage{padding:var(--space-6);background:var(--surface);color:var(--ink)}
.q{margin:0 0 var(--space-6);font:900 32px/40px var(--font-sans)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);max-width:720px;padding-bottom:var(--space-2)}
.cap{margin:0 0 var(--space-3);font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.gap{height:var(--space-8)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tri" viewBox="0 0 32 32"><path d="M16 4 28 26H4Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="dia" viewBox="0 0 32 32"><path d="M16 3 29 16 16 29 3 16Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="cir" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="currentColor" stroke="currentColor" stroke-width="3"/></symbol>
  <symbol id="sqr" viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="3" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="chk" viewBox="0 0 32 32"><path d="M7 17 13 23 25 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="x" viewBox="0 0 32 32"><path d="M9 9 23 23M23 9 9 23" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
</svg>
<section class="stage" data-theme="game">
  <p class="cap">Question · default</p>
  <h2 class="q">Кыргызстандын борбору кайсы шаар?</h2>
  <div class="grid">
    <button class="ak-tile"><svg class="ak-tile__shape" aria-hidden="true"><use href="#tri"/></svg>Ош</button>
    <button class="ak-tile ak-tile--blue"><svg class="ak-tile__shape" aria-hidden="true"><use href="#dia"/></svg>Бишкек</button>
    <button class="ak-tile ak-tile--yellow"><svg class="ak-tile__shape" aria-hidden="true"><use href="#cir"/></svg>Жалал-Абад</button>
    <button class="ak-tile ak-tile--green"><svg class="ak-tile__shape" aria-hidden="true"><use href="#sqr"/></svg>Каракол</button>
  </div>
  <div class="gap"></div>
  <p class="cap">Long text and locked answer</p>
  <div class="grid">
    <button class="ak-tile" aria-pressed="true"><svg class="ak-tile__shape" aria-hidden="true"><use href="#tri"/></svg>Ысык-Көл облусунун административдик борбору</button>
    <button class="ak-tile ak-tile--blue"><svg class="ak-tile__shape" aria-hidden="true"><use href="#dia"/></svg>Нарын</button>
    <button class="ak-tile ak-tile--yellow"><svg class="ak-tile__shape" aria-hidden="true"><use href="#cir"/></svg>Талас</button>
    <button class="ak-tile ak-tile--green"><svg class="ak-tile__shape" aria-hidden="true"><use href="#sqr"/></svg>Баткен</button>
  </div>
  <div class="gap"></div>
  <p class="cap">After the reveal</p>
  <div class="grid">
    <button class="ak-tile ak-tile--dim" disabled><svg class="ak-tile__shape" aria-hidden="true"><use href="#tri"/></svg>Ош</button>
    <button class="ak-tile ak-tile--blue"><svg class="ak-tile__shape" aria-hidden="true"><use href="#dia"/></svg>Бишкек<span class="ak-tile__mark ak-tile__mark--ok" role="img" aria-label="Туура!"><svg width="28" height="28" aria-hidden="true"><use href="#chk"/></svg></span></button>
    <button class="ak-tile ak-tile--yellow"><svg class="ak-tile__shape" aria-hidden="true"><use href="#cir"/></svg>Жалал-Абад<span class="ak-tile__mark ak-tile__mark--no" role="img" aria-label="Туура эмес"><svg width="28" height="28" aria-hidden="true"><use href="#x"/></svg></span></button>
    <button class="ak-tile ak-tile--dim" disabled><svg class="ak-tile__shape" aria-hidden="true"><use href="#sqr"/></svg>Каракол</button>
  </div>
</section>
</body></html>

<!doctype html>
<html lang="ky"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>body{margin:0;font-family:var(--font-sans)}.stage{padding:var(--space-6);background:var(--surface);color:var(--ink)}.cap{margin:0 0 var(--space-3);font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}.grid{display:grid;grid-template-columns:repeat(4,96px);gap:var(--space-6) var(--space-8);margin-bottom:var(--space-8)}.cell{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);font:500 12px/16px var(--font-sans);color:var(--ink-muted)}.row{display:flex;align-items:flex-end;gap:var(--space-6);margin-bottom:var(--space-8)}.chips{display:flex;flex-wrap:wrap;gap:var(--space-4);padding-bottom:var(--space-2)}</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><style>.bd{stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.c-red{fill:var(--tile-red);stroke:var(--tile-red-edge)}.c-blue{fill:var(--tile-blue);stroke:var(--tile-blue-edge)}.c-yellow{fill:var(--tile-yellow);stroke:var(--tile-yellow-edge)}.c-green{fill:var(--tile-green);stroke:var(--tile-green-edge)}.face-w{--face:var(--on-tile)}.face-d{--face:var(--on-tile-yellow)}.eye,.fl{fill:var(--face);stroke:none}.ln{fill:none;stroke:var(--face);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style><symbol id="av-tri-red" viewBox="0 0 48 48"><g class="bd c-red"><path d="M24 10 44 42H4Z"/><path d="M24 10V4"/><circle cx="24" cy="4" r="2.5"/></g><g class="face-w"><circle class="eye" cx="18" cy="31" r="2.6"/><circle class="eye" cx="30" cy="31" r="2.6"/><path class="ln" d="M19 36Q24 40 29 36"/></g></symbol><symbol id="av-tri-yellow" viewBox="0 0 48 48"><g class="bd c-yellow"><path d="M24 10 44 42H4Z"/></g><g class="face-d"><circle class="eye" cx="18" cy="31" r="2.6"/><path class="ln" d="M27.5 32Q30 29 32.5 32"/><path class="ln" d="M20 37Q25 40 29 36"/></g></symbol><symbol id="av-dia-blue" viewBox="0 0 48 48"><g class="bd c-blue"><path d="M24 3 45 24 24 45 3 24Z"/></g><g class="face-w"><circle class="eye" cx="18" cy="21" r="2.6"/><circle class="eye" cx="30" cy="21" r="2.6"/><path class="fl" d="M19.5 28Q24 36 28.5 28Z"/></g></symbol><symbol id="av-dia-green" viewBox="0 0 48 48"><g class="bd c-green"><path d="M24 3 45 24 24 45 3 24Z"/></g><g class="face-w"><path class="ln" d="M15.5 23Q18 19.5 20.5 23"/><path class="ln" d="M27.5 23Q30 19.5 32.5 23"/><path class="ln" d="M18.5 28Q24 34 29.5 28"/></g></symbol><symbol id="av-cir-yellow" viewBox="0 0 48 48"><g class="bd c-yellow"><circle cx="11" cy="13" r="6"/><circle cx="37" cy="13" r="6"/><circle cx="24" cy="26" r="17"/></g><g class="face-d"><circle class="eye" cx="18" cy="24" r="2.6"/><circle class="eye" cx="30" cy="24" r="2.6"/><path class="ln" d="M19 31Q24 36 29 31"/></g></symbol><symbol id="av-cir-red" viewBox="0 0 48 48"><g class="bd c-red"><circle cx="24" cy="25" r="18"/></g><g class="face-w"><circle class="eye" cx="17.5" cy="22" r="3.2"/><circle class="eye" cx="30.5" cy="22" r="3.2"/><circle class="eye" cx="24" cy="32" r="3.4"/></g></symbol><symbol id="av-sqr-green" viewBox="0 0 48 48"><g class="bd c-green"><path d="M19 10 24 3 29 10Z"/><rect x="6" y="10" width="36" height="34" rx="6"/></g><g class="face-w"><circle class="eye" cx="17" cy="26" r="2.6"/><circle class="eye" cx="31" cy="26" r="2.6"/><path class="ln" d="M18 33Q24 38 30 33"/></g></symbol><symbol id="av-sqr-blue" viewBox="0 0 48 48"><g class="bd c-blue"><rect x="6" y="8" width="36" height="36" rx="6"/></g><g class="face-w"><circle class="ln" cx="17" cy="25" r="5.5"/><circle class="ln" cx="31" cy="25" r="5.5"/><path class="ln" d="M22.5 25H25.5"/><circle class="eye" cx="17" cy="25" r="1.8"/><circle class="eye" cx="31" cy="25" r="1.8"/><path class="ln" d="M20 35Q24 38 28 35"/></g></symbol></svg>
<section class="stage" data-theme="game"><p class="cap">Eight characters</p><div class="grid"><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-tri-red"/></svg><span>0 · tri-red</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-tri-yellow"/></svg><span>1 · tri-yellow</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-dia-blue"/></svg><span>2 · dia-blue</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-dia-green"/></svg><span>3 · dia-green</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-cir-yellow"/></svg><span>4 · cir-yellow</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-cir-red"/></svg><span>5 · cir-red</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-sqr-green"/></svg><span>6 · sqr-green</span></div><div class="cell"><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-sqr-blue"/></svg><span>7 · sqr-blue</span></div></div><p class="cap">Sizes: 40, 64, 96</p><div class="row"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-tri-red"/></svg><svg class="ak-avatar ak-avatar--lg" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-tri-red"/></svg><svg class="ak-avatar ak-avatar--xl" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-tri-red"/></svg></div><p class="cap">Lobby chips</p><div class="chips"><span class="ak-chip"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-tri-red"/></svg><span>Айгерим</span></span><span class="ak-chip"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-dia-blue"/></svg><span>Бекзат</span></span><span class="ak-chip"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-cir-yellow"/></svg><span>Нурбек</span></span><span class="ak-chip"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-sqr-green"/></svg><span>Мээрим</span></span><span class="ak-chip"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-sqr-blue"/></svg><span>Эрлан</span></span><span class="ak-chip"><svg class="ak-avatar" viewBox="0 0 48 48" aria-hidden="true"><use href="#av-dia-green"/></svg><span>Жылдыз</span></span></div></section><section class="stage"><p class="cap">Staff lists use initials</p><div class="row" style="margin-bottom:0"><span class="ak-avatar ak-avatar--initial">А</span><span class="ak-avatar ak-avatar--initial ak-avatar--red">Ж</span><span class="ak-avatar ak-avatar--initial ak-avatar--green">Т</span><span class="ak-avatar ak-avatar--initial ak-avatar--yellow">К</span></div></section>

<!-- @dsCard group="Actions" height=420 subtitle="Hard bottom edge, presses down" -->
<!doctype html>
<html lang="ky"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans)}
.stage{padding:var(--space-6);background:var(--surface);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;margin-bottom:var(--space-6)}
.cap{margin:0 0 var(--space-3);font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
</style></head><body>
<section class="stage">
  <p class="cap">Staff · light</p>
  <div class="row">
    <button class="ak-btn">Оюнду баштоо</button>
    <button class="ak-btn ak-btn--accent">Кошуу</button>
    <button class="ak-btn ak-btn--success">Сактоо</button>
    <button class="ak-btn ak-btn--danger">Өчүрүү</button>
    <button class="ak-btn ak-btn--neutral">Артка</button>
    <button class="ak-btn" disabled>Күтө туруңуз</button>
  </div>
  <p class="cap">Large</p>
  <div class="row" style="margin-bottom:0"><button class="ak-btn ak-btn--lg ak-btn--accent">Баштоо!</button></div>
</section>
<section class="stage" data-theme="game">
  <p class="cap">Live game · game theme</p>
  <div class="row" style="margin-bottom:0">
    <button class="ak-btn ak-btn--lg">Оюнга кошулуу</button>
    <button class="ak-btn ak-btn--lg ak-btn--accent">Кийинки суроо</button>
    <button class="ak-btn ak-btn--neutral">Чыгуу</button>
    <button class="ak-btn" disabled>Күтө туруңуз</button>
  </div>
</section>
</body></html>

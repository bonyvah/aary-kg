<!-- @dsCard group="Forms" height=520 subtitle="PIN, nickname, login" -->
<!doctype html>
<html lang="ky"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans)}
.stage{padding:var(--space-6);background:var(--surface);color:var(--ink)}
.col{display:flex;flex-direction:column;gap:var(--space-5);max-width:360px}
.cap{margin:0 0 var(--space-3);font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
</style></head><body>
<section class="stage" data-theme="game">
  <p class="cap">Player join · game theme</p>
  <div class="col">
    <div class="ak-field">
      <label class="ak-label" for="pin">Оюн PIN коду</label>
      <input id="pin" class="ak-input ak-input--pin" inputmode="numeric" autocomplete="off" placeholder="123 456">
    </div>
    <div class="ak-field">
      <label class="ak-label" for="nick">Никнейм</label>
      <input id="nick" class="ak-input" value="Айгерим" aria-invalid="true" aria-describedby="nick-err">
      <span id="nick-err" class="ak-error">Бул ат ээленген. Башка ат тандаңыз.</span>
    </div>
    <button class="ak-btn ak-btn--lg ak-btn--block">Кирүү</button>
  </div>
</section>
<section class="stage">
  <p class="cap">Staff login · light theme</p>
  <div class="col">
    <div class="ak-field">
      <label class="ak-label" for="login">Логин</label>
      <input id="login" class="ak-input" placeholder="aizhan.m">
    </div>
    <div class="ak-field">
      <label class="ak-label" for="pw">Сырсөз</label>
      <input id="pw" class="ak-input" type="password" value="password123">
      <span class="ak-help">Сырсөздү администратор берет.</span>
    </div>
    <div class="ak-field">
      <label class="ak-label" for="off">Өчүрүлгөн талаа</label>
      <input id="off" class="ak-input" value="Өзгөртүү мүмкүн эмес" disabled>
    </div>
  </div>
</section>
</body></html>

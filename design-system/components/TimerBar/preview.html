<!-- @dsCard group="Game" height=260 subtitle="Linear countdown, red for the last seconds" -->
<!doctype html>
<html lang="ky"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
body{margin:0;font-family:var(--font-sans)}
.stage{padding:var(--space-6);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:var(--space-6)}
.cap{margin:0 0 var(--space-2);font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.unit{font:700 14px/20px var(--font-sans);color:var(--ink-muted)}
</style></head><body>
<section class="stage" data-theme="game">
  <div>
    <p class="cap">20 сек, start</p>
    <div class="ak-timer" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20" style="--pct:100%">
      <div class="ak-timer__track"><div class="ak-timer__fill"></div></div>
      <span class="ak-timer__num">20</span><span class="unit">сек</span>
    </div>
  </div>
  <div>
    <p class="cap">8 сек left</p>
    <div class="ak-timer" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="8" style="--pct:40%">
      <div class="ak-timer__track"><div class="ak-timer__fill"></div></div>
      <span class="ak-timer__num">8</span><span class="unit">сек</span>
    </div>
  </div>
  <div>
    <p class="cap">Last seconds</p>
    <div class="ak-timer ak-timer--urgent" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="3" style="--pct:15%">
      <div class="ak-timer__track"><div class="ak-timer__fill"></div></div>
      <span class="ak-timer__num">3</span><span class="unit">сек</span>
    </div>
  </div>
</section>
</body></html>

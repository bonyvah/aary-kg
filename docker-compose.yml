services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aary
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aary"]
      interval: 1s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 20

  # The backend and the web app run from your source folders (bind mounts) and reload on every save.
  # The backend image is the production one; only the command and the mounted code differ.
  backend:
    build: ./backend
    # OPENAI_API_KEY (questions from teaching material) and any other local setting. The values under
    # `environment` below win over this file.
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AARY_ENV: dev
      AARY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aary
      AARY_REDIS_URL: redis://redis:6379/0
      AARY_JWT_SECRET: change-me-change-me-change-me-change-me
      AARY_COOKIE_SECURE: "false"
      # Add a tunnel origin (ngrok) in .env: AARY_ALLOWED_ORIGINS=http://localhost:3000,https://<x>.ngrok-free.dev
      AARY_ALLOWED_ORIGINS: ${AARY_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      AARY_TRUSTED_PROXY_HOPS: "0"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --no-proxy-headers
    ports: ["${BACKEND_PORT:-8000}:8000"]
    # The image's check runs every 15s, so `up --wait` idled until the first one. Check often in dev.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 0s

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # Files saved on the host do not send events into the container reliably everywhere.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      - frontend_corepack:/root/.cache/node/corepack
    command:
      - sh
      - -c
      - corepack enable && corepack prepare pnpm@10.28.0 --activate && { [ node_modules/.modules.yaml -nt pnpm-lock.yaml ] || pnpm install --frozen-lockfile; } && exec pnpm exec next dev -H 0.0.0.0 -p 3000
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
  frontend_corepack:
